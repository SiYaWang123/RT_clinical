<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼吸治療實習生臨床情境與知識答題網頁</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --tbi: #e74c3c; --tbi-light: #fdecea; --tbi-dark: #c0392b;
    --sci: #2980b9; --sci-light: #eaf4fb; --sci-dark: #1a6090;
    --success: #27ae60; --error: #e74c3c;
    --text: #2c3e50; --muted: #7f8c8d; --bg: #f0f3f7;
    --card: #ffffff; --border: #e0e6ed;
    --active: #3498db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background: var(--bg); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
  .wrap { width: 100%; max-width: 650px; }
  .card { background: var(--card); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
  h1 { text-align: center; color: var(--text); margin-bottom: 25px; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .desc { font-size: 0.95rem; color: var(--muted); line-height: 1.6; margin-bottom: 20px; text-align: center; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 700; margin-bottom: 5px; color: var(--text); font-size: 0.9rem; }
  .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; outline: none; transition: border 0.2s; }
  .form-group input:focus { border-color: var(--active); }
  .topic-btn { display: block; width: 100%; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; text-align: center; cursor: pointer; border: none; transition: all 0.2s; margin-bottom: 12px; }
  .btn-tbi { background: var(--tbi-light); color: var(--tbi-dark); border: 1px solid var(--tbi); }
  .btn-tbi:hover { background: var(--tbi); color: #fff; }
  .btn-sci { background: var(--sci-light); color: var(--sci-dark); border: 1px solid var(--sci); }
  .btn-sci:hover { background: var(--sci); color: #fff; }
  .settings-toggle { font-size: 0.85rem; color: var(--muted); cursor: pointer; text-align: center; margin-top: 10px; user-select: none; }
  .settings-toggle:hover { color: var(--active); }
  .settings-panel { display: none; margin-top: 14px; padding: 14px; background: #f8f9fa; border-radius: 8px; border: 1px solid var(--border); font-size: 0.88rem; }
  .settings-panel.open { display: block; }
  .settings-panel label { font-weight: 700; color: var(--text); display: block; margin-bottom: 5px; }
  .settings-panel input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none; }
  .settings-panel input:focus { border-color: var(--active); }
  .settings-panel .hint { font-size: 0.78rem; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .settings-panel .hint a { color: var(--active); }
  .setup-steps { margin-top: 10px; padding: 10px; background: #fff; border-radius: 6px; border: 1px solid var(--border); }
  .setup-steps p { font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 0.82rem; }
  .setup-steps ol { padding-left: 16px; color: var(--muted); font-size: 0.78rem; line-height: 1.8; }
  .setup-steps code { background: #e8f0fe; color: #1a73e8; padding: 1px 4px; border-radius: 3px; font-size: 0.78rem; }
  .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .nav-title { font-weight: 700; font-size: 1.1rem; }
  .progress-bar-container { background: var(--border); height: 8px; border-radius: 4px; width: 100%; margin-bottom: 20px; overflow: hidden; }
  .progress-bar { height: 100%; transition: width 0.3s; }
  .q-container { display: none; }
  .q-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; margin-bottom: 10px; }
  .badge-k { background: #ffeaa7; color: #d63031; }
  .badge-s { background: #fab1a0; color: #e17055; }
  .badge-a { background: #81ecec; color: #00cec9; }
  .q-text { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.5; margin-bottom: 15px; }
  .opt { display: flex; align-items: center; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; line-height: 1.4; color: var(--text); }
  .opt:hover { background: #f8f9fa; border-color: var(--muted); }
  .opt.selected { background: #e8f4fd; border-color: var(--active); font-weight: 700; }
  .opt.disabled { cursor: not-allowed; pointer-events: none; }
  .opt.correct { background: #e8f5e9 !important; border-color: #27ae60 !important; color: #1e7e34 !important; font-weight: 700; }
  .opt.correct .opt-idx { background: #27ae60 !important; color: white !important; }
  .opt.incorrect { background: #fdecea !important; border-color: #e74c3c !important; color: #c0392b !important; }
  .opt.incorrect .opt-idx { background: #e74c3c !important; color: white !important; }
  .opt-idx { font-weight: 700; margin-right: 10px; background: var(--border); width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 0.85rem; flex-shrink: 0; }
  .opt.selected .opt-idx { background: var(--active); color: white; }
  .explanation-box { animation: slideDown 0.3s ease-out; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .act-btns { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .btn { padding: 10px 20px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; transition: background 0.2s; display: flex; align-items: center; gap: 5px; }
  .btn-prev { background: #e0e6ed; color: #2c3e50; }
  .btn-prev:hover { background: #d1d8e0; }
  .btn-next { background: var(--active); color: white; }
  .btn-next:hover { background: #2980b9; }
  .report-card { background: white; border-radius: 12px; border: 2px solid var(--border); padding: 30px; margin-bottom: 20px; }
  .rpt-header { text-align: center; border-bottom: 2px dashed var(--border); padding-bottom: 20px; margin-bottom: 20px; }
  .rpt-title { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 5px; }
  .rpt-meta { font-size: 0.9rem; color: var(--muted); margin-bottom: 15px; }
  .rpt-score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .score-box { border-radius: 8px; padding: 15px; text-align: center; border: 1px solid var(--border); }
  .score-val { font-size: 2rem; font-weight: 800; margin-top: 5px; }
  .report-item { border-bottom: 1px solid var(--border); padding: 15px 0; }
  .report-item:last-child { border-bottom: none; }
  .ri-q { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-bottom: 8px; }
  .ri-ans { font-size: 0.9rem; color: var(--muted); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
  .tag-ok { background: #d4edda; color: #155724; }
  .tag-ng { background: #f8d7da; color: #721c24; }
  .ri-exp { font-size: 0.85rem; color: #57606f; background: #f1f2f6; padding: 10px; border-radius: 6px; line-height: 1.5; margin-top: 5px; border-left: 3px solid #ced6e0; }
  .actions-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .btn-dl { background: var(--success); color: white; flex: 1; min-width: 140px; justify-content: center; padding: 12px; font-size: 1rem; }
  .btn-dl:hover { background: #219653; }
  .btn-upload { background: #4285f4; color: white; flex: 1; min-width: 140px; justify-content: center; padding: 12px; font-size: 1rem; }
  .btn-upload:hover { background: #3367d6; }
  .btn-restart { background: #7f8c8d; color: white; flex: 1; min-width: 140px; justify-content: center; padding: 12px; font-size: 1rem; }
  .btn-restart:hover { background: #6f7c7d; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2c3e50; color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- S1: Welcome -->
  <div id="s-welcome" class="card">
    <h1>🩺 呼吸治療實習生臨床情境與知識答題網頁</h1>
    <p class="desc">歡迎使用！本網頁旨在提供呼吸治療實習學生，針對急性腦傷（TBI）與脊髓損傷（SCI）的呼吸相關處置進行臨床學理與專業態度的情境模擬與預習。</p>
    <div class="form-group">
      <label for="username">姓名</label>
      <input type="text" id="username" placeholder="請輸入姓名">
    </div>
    <div class="form-group">
      <label for="userid">學校</label>
      <input type="text" id="userid" placeholder="請輸入學校">
    </div>
    <div style="margin-top: 25px;">
      <p style="font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 10px; text-align: center;">請選擇評核主題</p>
      <button class="topic-btn btn-tbi" onclick="startQuiz('tbi')">🧠 急性腦損傷（TBI）</button>
      <button class="topic-btn btn-sci" onclick="startQuiz('sci')">♿ 脊髓損傷（SCI）</button>
    </div>
  </div>

  <!-- S2: Quiz -->
  <div id="s-quiz" class="card hide">
    <div class="nav-bar">
      <div class="nav-title" id="quiz-topic-title">-</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
        <div style="font-size:0.9rem;color:var(--muted);" id="quiz-progress-text">0 / 0</div>
        <div style="font-size:0.75rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:0.03em;" id="quiz-timer">⏱ 00:00</div>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="quiz-progress-bar" style="width: 0%;"></div>
    </div>
    <div id="q-area"></div>
    <div class="act-btns">
      <button class="btn btn-prev" onclick="prevQ()">⬅️ 上一題</button>
      <button class="btn btn-next" onclick="nextQ()">下一題 ➡️</button>
    </div>
  </div>

  <!-- S3: Result -->
  <div id="s-result" class="hide">
    <div id="report-capture" class="report-card">
      <div class="rpt-header">
        <div class="rpt-title">📋 臨床技能與知識彙總答題頁面</div>
        <div class="rpt-meta" id="rpt-meta-info">姓名：-　學校：-</div>
        <p style="font-size: 0.85rem; color: var(--muted); margin-top: 5px;">本報告由答題網頁自動生成</p>
      </div>
      <div class="rpt-score-grid">
        <div class="score-box" style="background: #fafbfc;">
          <div style="font-size: 0.85rem; font-weight: 700; color: var(--muted);">評核單元</div>
          <div style="font-size: 1.1rem; font-weight: 700; color: var(--text); margin-top: 5px;" id="rpt-topic-name">-</div>
        </div>
        <div class="score-box" style="background: #f4faf6;">
          <div style="font-size: 0.85rem; font-weight: 700; color: var(--muted);">評核總分</div>
          <div class="score-val" id="rpt-score-big">-</div>
        </div>
      </div>
      <div id="rpt-time" style="font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; text-align: right;">-</div>
      <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text); border-left: 4px solid var(--active); padding-left: 10px; margin-bottom: 15px;">評核題型詳情</h3>
      <div id="rpt-items"></div>
    </div>
    <div class="actions-row">
      <button class="btn btn-dl" onclick="downloadPDF()">📄 下載 PDF 報告</button>
      <button class="btn btn-restart" onclick="restart()">🔄 重新開始</button>
    </div>
  </div>
</div>

<script>
// ─── Questions ────────────────────────────────────────────────────────────────
const questions = {
  tbi: {
    knowledge: [
      // K1 (unchanged)
      {
        q: "對於嚴重急性腦傷合併急性呼吸窘迫症候群（ARDS）患者，在沒有顱內壓（ICP）升高的情況下，關於 PEEP 的設定，下列何者正確？",
        a: "應完全禁用 PEEP，以防止胸腔內壓上升阻礙靜脈回流而導致 ICP 升高",
        b: "不論氧合狀況如何，皆應固定設定於 5 cmH2O 且不可調整",
        c: "PEEP 設定應與無腦傷之一般患者相同，在臨床密切監測下調整，以維持肺泡開放並避免低血氧",
        d: "應設定極高水平的 PEEP（如 > 20 cmH2O），以確保肺泡開放，不需考量腦部灌注與 ICP",
        ans: "c",
        exp: "根據歐洲重症醫學會（ESICM）共識，若急性腦傷患者無顯著 ICP 升高，其 PEEP 設定與無腦傷之一般患者相同（即採取標準肺保護策略），通常在密切監測下維持適當 PEEP 以確保氧合，避免缺氧造成的二次腦損傷。"
      },
      // K2 NEW: Head position & ICP
      {
        q: "對於嚴重急性腦傷患者，臨床上常規抬高床頭30–45° 的主要生理目的與依據為何？",
        a: "抬高床頭主要是為了增加腦部動脈血流灌注，透過重力使更多動脈血液流向大腦",
        b: "抬高床頭 30–45° 能促進頸靜脈回流、降低顱內靜脈壓，從而有效降低顱內壓（ICP），同時不顯著影響腦灌注壓（CPP）",
        c: "主要目的是預防褥瘡，與顱內壓及腦部血流無生理相關",
        d: "應常規擺平床頭（0°），以最大化腦部靜脈回流並降低顱內壓",
        ans: "b",
        exp: "抬高床頭 30–45° 可透過重力改善頸靜脈（Jugular Vein）回流，降低顱內靜脈壓與硬腦膜靜脈竇壓，進而有效降低顱內壓（ICP）。但需注意，過度抬高（> 45°）可能因降低平均動脈壓（MAP）而使腦灌注壓（CPP）下降，故建議維持 30–45° 為最佳擺位角度，並同步監測 ICP 與 CPP 的變化。"
      },
      // K3 (unchanged)
      {
        q: "針對嚴重急性腦傷患者，其動脈血氧分壓（PaO2）與血氧飽和度（SpO2）的目標範圍，下列何者最適當？",
        a: "PaO2 55–80 mmHg，SpO2 88–92%",
        b: "PaO2 > 150 mmHg，SpO2 100%",
        c: "PaO2 60–70 mmHg，SpO2 90–93%",
        d: "PaO2 80–120 mmHg，SpO2 ≥ 95%",
        ans: "d",
        exp: "根據歐洲重症醫學會（ESICM）共識指引，急性腦傷患者之血氧目標應維持 PaO2 在 80–120 mmHg，SpO2 ≥ 95%，以避免低血氧（PaO2 < 60 mmHg）導致之繼發性腦部缺氧損傷，同時避免組織氧過高（hyperoxia）產生的自由基傷害與血管痙攣。"
      },
      // K4 (unchanged)
      {
        q: "在重症加護病房中，預防急性腦傷患者發生二次腦損傷（secondary brain injury），關於全身血液動力學與腦灌注壓（CPP）的目標，下列何者正確？",
        a: "應維持平均動脈壓（MAP）以確保腦灌注壓（CPP）維持在 60–70 mmHg 之間，避免腦部灌注不足或過度充血",
        b: "為了將腦水腫降至最低，應刻意維持 CPP 在 40–50 mmHg 的極低水平",
        c: "應常規將收縮壓（SBP）降至 90 mmHg 以下，以防顱內出血擴大",
        d: "CPP 應維持得越高越好（如 > 100 mmHg），以確保腦細胞能得到足夠的灌注",
        ans: "a",
        exp: "根據創傷重症指引，嚴重創傷性腦傷（TBI）患者應維持腦灌注壓（CPP）在 60–70 mmHg。CPP 過低（< 50 mmHg）會導致腦部灌注不足與缺血；CPP 過高（> 70 mmHg）則可能引發或加重血管源性腦水腫及急性呼吸窘迫症候群（ARDS）。"
      },
      // K5 (unchanged)
      {
        q: "嚴重創傷性腦傷（TBI）患者在氣道保護與呼吸器脫離過程中，對於氣管切開術（Tracheostomy）時機的共識建議，下列敘述何者最適當？",
        a: "所有創傷性腦傷病患無論嚴重度，皆應在插管當天立即執行氣切術",
        b: "對於預期需要長期機械通氣的嚴重腦傷患者，建議在氣管插管 7 天內執行早期氣切，可減少呼吸器天數與 ICU 住院天數",
        c: "無論如何都應嘗試插管通氣 21 天以上，唯有拔管失敗滿 3 次才能考慮執行氣切",
        d: "氣切手術會顯著增加顱內壓（ICP）與腦壓惡化，因而是腦傷患者的絕對禁忌症",
        ans: "b",
        exp: "根據 CENTER-TBI 大型研究與重症指引，對於預估需要長期（> 10–14 天）人工氣道的嚴重腦傷患者，早期氣切（7 天內）能顯著縮短呼吸器使用時間、調降呼吸道阻力、便於痰液清除並減少呼吸道死腔，進而調降加護病房住院天數與肺部感染率。"
      },
      // K6 (unchanged)
      {
        q: "關於嚴重創傷性腦傷（TBI）患者在重症照護期間的紅血球輸血（blood transfusion）指引，下列敘述何者最適當？",
        a: "應採取極度嚴格的輸血策略，僅在血紅素 Hb < 5 g/dL 時才考慮輸血，以避免任何輸血相關肺損傷（TRALI）",
        b: "應常規將血紅素維持在 14 g/dL 以上，以維持良好氧合狀態",
        c: "應採取寬鬆的輸血策略，維持血紅素（Hb）高於 9 g/dL，以優化腦部氧氣遞送（cerebral oxygen delivery）並預防繼發性腦缺氧",
        d: "輸血指標僅與病患年齡相關，與腦部氧合及血液動力學無關",
        ans: "c",
        exp: "根據急性腦傷重症管理建議，由於腦部組織對缺氧極為敏感，維持足夠的動脈血氧含量（CaO2）與腦氧遞送至關重要。一般重症雖採嚴格輸血（Hb < 7 g/dL），但在 TBI 患者常建議採取寬鬆輸血策略（通常維持血紅素 Hb ≥ 9 g/dL），以防貧血引發繼發性腦部缺氧損傷。"
      },
      // K7 NEW: VAP prevention bundle (general ICU)
      {

        exp: "跨團隊合作（Interprofessional Collaboration）是現代醫療評核的核心。RT 應主動確保在進行復健治療時呼吸道安全與呼吸狀況穩定。"
      },
      {
        q: "面對長期需通氣的 SCI 病人，關於氣切（Tracheostomy）的溝通，何者展現了正確的專業醫學態度？",
        a: "告知氣切後便再也不能說話與進食",
        b: "恐嚇病人若不氣切會立刻死亡",
        c: "提供實證數據：解釋早期氣切可減少感染與藥物使用，且後續可搭配發聲閥以恢復社交",
        d: "建議家屬不要讓病人知道有氣切這件事",
        ans: "c",
        exp: "專業 RT 應基於文獻（如 UpToDate）提供科學且具希望感的諮詢。說話瓣膜（PMV）的使用確實能幫助氣切病人恢復發聲，這是重要的生活品質議題。"
      }
    ]
  }
};

// ─── Google Sheet 成績記錄網址 ────────────────────────────────────────────────
// 把你部署好的「成績記錄_AppScript_獨立版.gs」的 /exec 網址貼在這裡
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbw38Qo2Q8Cqy-tWONBiPP59OB77wjlRfgbxGQnG_lucaoyH8ZA3pkzFMAN0aOU2LbwM/exec';

// ─── State ───────────────────────────────────────────────────────────────────
let currentTopic = '';
let currentQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let quizResult = null;

// ─── Timer ───────────────────────────────────────────────────────────────────
let timerInterval = null;
let elapsedSeconds = 0;

function startTimer() {
  elapsedSeconds = 0;
  const el = document.getElementById('quiz-timer');
  if (el) el.textContent = '⏱ 00:00';
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSeconds++;
    const mm = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
    const ss = String(elapsedSeconds % 60).padStart(2, '0');
    const el = document.getElementById('quiz-timer');
    if (el) el.textContent = `⏱ ${mm}:${ss}`;
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const mm = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
  const ss = String(elapsedSeconds % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

// ─── UI helpers ──────────────────────────────────────────────────────────────
function show(id) {
  ['s-welcome','s-quiz','s-result'].forEach(s => {
    document.getElementById(s).classList.add('hide');
  });
  document.getElementById(id).classList.remove('hide');
}

function showToast(msg, duration) {
  duration = duration || 3000;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ─── 隨機打亂（Fisher-Yates），不修改原陣列 ──────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── Quiz logic ──────────────────────────────────────────────────────────────
function startQuiz(topic) {
  const uname = document.getElementById('username').value.trim();
  const usid  = document.getElementById('userid').value.trim();
  if (!uname || !usid) { alert('請填寫姓名與學校！'); return; }

  currentTopic = topic;
  currentIndex = 0;
  const tData = questions[topic];
  currentQuestions = [];
  // 每次開始時在各分類內部隨機打亂，維持 知識→技能→態度 的大分類順序
  shuffle(tData.knowledge).forEach(q => currentQuestions.push({...q, type: 'knowledge'}));
  shuffle(tData.skill).forEach(q     => currentQuestions.push({...q, type: 'skill'}));
  shuffle(tData.attitude).forEach(q  => currentQuestions.push({...q, type: 'attitude'}));
  userAnswers = new Array(currentQuestions.length).fill(null);

  document.getElementById('quiz-topic-title').textContent =
    topic === 'tbi' ? '🧠 急性腦傷（TBI）臨床照護' : '♿ 脊髓損傷（SCI）臨床照護';

  startTimer();
  renderQuestion();
  show('s-quiz');
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  const qArea = document.getElementById('q-area');
  let typeBadge = '';
  if (q.type === 'knowledge') typeBadge = '<span class="q-badge badge-k">📚 知識面</span>';
  else if (q.type === 'skill') typeBadge = '<span class="q-badge badge-s">⚙️ 技能面（ABG/臨床）</span>';
  else typeBadge = '<span class="q-badge badge-a">🤝 態度面</span>';

  const chosen     = userAnswers[currentIndex];
  const isAnswered = chosen !== null;
  const optKeys    = ['a','b','c','d'];
  let optionsHtml  = '';

  optKeys.forEach(key => {
    let cls = 'opt';
    if (isAnswered) {
      cls += ' disabled';
      if (key === q.ans)      cls += ' correct';
      else if (chosen === key) cls += ' incorrect';
    } else {
      if (chosen === key) cls += ' selected';
    }
    optionsHtml += `<div class="${cls}" onclick="selectOpt('${key}')">
      <div class="opt-idx">${key.toUpperCase()}</div>
      <div style="flex:1;">${q[key]}</div>
    </div>`;
  });

  let expHtml = '';
  if (isAnswered) {
    const ok = chosen === q.ans;
    expHtml = `<div class="explanation-box" style="margin-top:20px;padding:18px;border-radius:8px;border-left:5px solid ${ok?'var(--success)':'var(--error)'};background:${ok?'#e8f5e933':'#fdecea33'};border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);">
      <div style="font-weight:800;font-size:1.05rem;color:${ok?'var(--success)':'var(--error)'};margin-bottom:8px;">${ok?'✨ 答對了！學理扎實，繼續保持！':'❌ 答錯了！正確答案是 [ '+q.ans.toUpperCase()+' ]'}</div>
      <div style="font-size:0.95rem;color:var(--text);line-height:1.6;"><strong>💡 臨床解析：</strong>${q.exp}</div>
    </div>`;
  }

  qArea.innerHTML = `${typeBadge}<div class="q-text">${currentIndex+1}. ${q.q}</div>${optionsHtml}${expHtml}`;

  document.getElementById('quiz-progress-text').textContent = `${currentIndex+1} / ${currentQuestions.length}`;
  const pBar = document.getElementById('quiz-progress-bar');
  pBar.style.width = `${((currentIndex+1)/currentQuestions.length)*100}%`;
  pBar.style.background = `var(--${currentTopic})`;

  const nextBtn = document.querySelector('.btn-next');
  if (currentIndex === currentQuestions.length - 1) {
    nextBtn.textContent = '🏁 送出評核';
    nextBtn.style.background = 'var(--success)';
  } else {
    nextBtn.textContent = '下一題 ➡️';
    nextBtn.style.background = 'var(--active)';
  }
}

function selectOpt(val) {
  if (userAnswers[currentIndex] !== null) return;
  userAnswers[currentIndex] = val;
  renderQuestion();
}

function prevQ() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

function nextQ() {
  if (userAnswers[currentIndex] === null) { alert('請先選擇一個答案以看臨床解析！'); return; }
  if (currentIndex < currentQuestions.length - 1) { currentIndex++; renderQuestion(); }
  else finishQuiz();
}

function finishQuiz() {
  const uname = document.getElementById('username').value.trim();
  const usid  = document.getElementById('userid').value.trim();
  let score = 0;
  const total = currentQuestions.length;
  const records = currentQuestions.map((q, i) => {
    const ok = userAnswers[i] === q.ans;
    if (ok) score++;
    const opt = l => ({ a:'A. '+q.a, b:'B. '+q.b, c:'C. '+q.c, d:'D. '+q.d }[l] || '-');
    return { q: q.q, chosen: opt(userAnswers[i]), correct_ans: opt(q.ans), ok, exp: q.exp };
  });
  const pct = Math.round((score/total)*100);
  const totalTime = stopTimer();
  quizResult = { name: uname, school: usid, topic: currentTopic === 'tbi' ? '急性腦傷(TBI)' : '脊髓損傷(SCI)', score, total, percentage: pct, timestamp: new Date().toLocaleString(), totalTime };

  document.getElementById('rpt-topic-name').textContent   = quizResult.topic;
  document.getElementById('rpt-meta-info').textContent    = `姓名：${uname}　學校：${usid}`;
  document.getElementById('rpt-score-big').innerHTML      = `<span style="color:var(--${currentTopic})">${score} / ${total}（${pct}%）</span>`;
  document.getElementById('rpt-time').textContent         = '評核時間：' + quizResult.timestamp;

  document.getElementById('rpt-items').innerHTML = records.map((r,i) => `
    <div class="report-item">
      <div class="ri-q">${i+1}. ${r.q}</div>
      <div class="ri-ans"><span class="tag ${r.ok?'tag-ok':'tag-ng'}">${r.ok?'正確 Correct':'錯誤 Incorrect'}</span> 您的選擇：${r.chosen}</div>
      ${!r.ok ? `<div class="ri-ans" style="color:var(--success);font-weight:700;">➜ 正確解答：${r.correct_ans}</div>` : ''}
      <div class="ri-exp">💡 臨床解析：${r.exp}</div>
    </div>`).join('');

  show('s-result');
  if (SHEET_URL) uploadToSheets();
}

// ─── PDF Download ─────────────────────────────────────────────────────────────
async function downloadPDF() {
  const btn = document.querySelector('[onclick="downloadPDF()"]');
  btn.textContent = '⏳ PDF 生成中...';
  btn.disabled = true;
  try {
    const el = document.getElementById('report-capture');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgData = canvas.toDataURL('image/jpeg', 0.85);
    const imgW = pageW;
    const imgH = (canvas.height * pageW) / canvas.width;
    let heightLeft = imgH;
    let pos = 0;
    pdf.addImage(imgData, 'JPEG', 0, pos, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0) {
      pos = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, pos, imgW, imgH);
      heightLeft -= pageH;
    }
    const uname = document.getElementById('username').value.trim() || '學生';
    pdf.save(`RT_臨床評核報告_${uname}.pdf`);
    showToast('✅ PDF 下載成功！');
  } catch(e) {
    console.error(e);
    alert('PDF 生成失敗，請重試或截圖儲存。');
  }
  btn.textContent = '📄 下載 PDF 報告';
  btn.disabled = false;
}

// ─── Google Sheet Upload ──────────────────────────────────────────────────────
// 使用 navigator.sendBeacon()：不受 file:// 跨域限制，fire-and-forget，最可靠
function uploadToSheets() {
  if (!SHEET_URL || !quizResult) return;
  try {
    const payload = JSON.stringify(quizResult);
    const blob = new Blob([payload], { type: 'text/plain' });
    const sent = navigator.sendBeacon(SHEET_URL, blob);
    console.log(sent ? '✅ 成績已送出（sendBeacon）' : '⚠️ sendBeacon 回傳 false，請確認網址是否正確');
  } catch(e) {
    console.error('❌ 成績上傳失敗：', e);
  }
}

function restart() { quizResult = null; show('s-welcome'); }
</script>
